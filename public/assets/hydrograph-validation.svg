<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Observed versus projected flood hydrograph">
  <defs>
    <linearGradient id="hv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12305f"/>
      <stop offset="1" stop-color="#0b1c40"/>
    </linearGradient>
    <linearGradient id="hv-obs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="200" height="300" fill="url(#hv-bg)"/>

  <!-- baseline grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="16" y1="200" x2="184" y2="200"/>
    <line x1="16" y1="160" x2="184" y2="160"/>
    <line x1="16" y1="120" x2="184" y2="120"/>
    <line x1="16" y1="80"  x2="184" y2="80"/>
  </g>

  <!-- observed: filled flood peak -->
  <path d="M16,200 C55,200 76,92 100,86 C124,92 145,200 184,200 Z" fill="url(#hv-obs)"/>
  <path d="M16,200 C55,200 76,92 100,86 C124,92 145,200 184,200"
        fill="none" stroke="#93c5fd" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- projected: dashed line, closely tracking observed -->
  <path d="M16,202 C56,201 78,104 100,99 C122,104 144,201 184,202"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"
        stroke-dasharray="5 4" stroke-linecap="round"/>
</svg>
