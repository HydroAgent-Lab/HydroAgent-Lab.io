name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  # Daily rebuild to pick up Paper Digest papers. The collector publishes
  # papers.json at 08:30 Rome; 08:00 UTC is 09:00 (winter) / 10:00 (summer).
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      digest_ready: ${{ steps.digest_ready.outputs.ready }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Paper Digest papers, pushed daily by the collector server. The build
      # fails if the file is missing or invalid, so Pages keeps the last site.
      - name: Check out Paper Digest data
        uses: actions/checkout@v4
        with:
          repository: HydroAgent-Lab/paper-digest-data
          path: .digest-data

      - name: Check published digest prerequisite
        id: digest_ready
        shell: bash
        run: |
          if test -f .digest-data/papers.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for the collector's first papers.json publication. Existing website stays online."
          fi

      - name: Test
        if: steps.digest_ready.outputs.ready == 'true'
        run: npm test

      - name: Build static site
        if: steps.digest_ready.outputs.ready == 'true'
        run: npm run build
        env:
          PAPER_DIGEST_DATA: .digest-data/papers.json

      - name: Setup Pages
        if: steps.digest_ready.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload static export
        if: steps.digest_ready.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.digest_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
